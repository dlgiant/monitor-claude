apiVersion: 1

groups:
  - orgId: 1
    name: claude-code-stuck
    folder: Claude Code
    interval: 1m
    rules:
      - uid: stuck-prompt-detected
        title: Stuck prompt — heavy fan-out
        condition: B
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Active prompt has accumulated {{ $values.B.Value | printf \"%.0f\" }} API requests in the last 5 minutes"
          description: "A single prompt_id is fanning out heavily. Likely thrashing on Bash / search loops. Consider Esc → /clear → re-prompt with a tighter scope."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'topk(1, sum by (prompt_id) (count_over_time({service_name="claude-code"} | event_name = `api_request` [5m])))'
              queryType: instant
              instant: true
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 15
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
              intervalMs: 1000
              maxDataPoints: 43200
