services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: cc-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  <-- point Claude Code here
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - prometheus
      - tempo
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: cc-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-otlp-receiver'
      - '--enable-feature=native-histograms'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-admin-api'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: cc-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.3.2
    container_name: cc-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: "0"
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: cc-grafana
    restart: unless-stopped
    extra_hosts:
      # Lets Grafana's webhook contact point reach the local notify-receiver
      # running on the host at 127.0.0.1:5678 via http://host.docker.internal:5678
      - "host.docker.internal:host-gateway"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_LOG_LEVEL=warn
      # Plotly panel for the 3D agent-graph view. Allow unsigned because
      # this plugin is community-maintained (no Grafana Cloud signature).
      - GF_INSTALL_PLUGINS=ae3e-plotly-panel
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=ae3e-plotly-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
